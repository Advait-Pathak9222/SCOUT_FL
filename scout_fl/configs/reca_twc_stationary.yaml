experiment: reca_twc_stationary
seed: 0
output_dir: outputs
rounds: 150
first_shift_round: 1000
first_shift_end: 1000
second_shift_round: 1000

network:
  num_clients: 100
  budget: 10

wireless:
  uplink_snr_db: 20
  sensing_snr_db: 20
  fading: rician
  blockage_probability: 0.0
  power_budget: 1.0
  bandwidth_budget: 1.0
  latency_budget: 1.0
  energy_budget: 1.0
  aircomp_mse_threshold: 0.05

sensing:
  num_targets: 3
  crb_threshold: 1.0
  sensing_resource_budget: 1.0

reca:
  feature_dim: 6
  output_dim: 6
  tau_reuse: 0.7
  trigger_tau: 0.2
  adapter_memory_budget: 4
  log_wireless_metrics: true
  log_sensing_metrics: true
  log_adapter_metrics: true

selection:
  methods: [reca, random, fedcs, oort, ota_fedavg, ota_fl_iscc, fed_iscc, iscc_air_feel, asaad, sensing_native]

metrics:
  log: [accuracy, crb, crb_cvar, aircomp_mse, aircomp_mse_cvar, energy, latency, violations, jain, selection_time, round_time]
