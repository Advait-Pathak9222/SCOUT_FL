experiment: reca_twc_powercontrol
seed: 0
output_dir: outputs
rounds: 150
first_shift_round: 50
first_shift_end: 90
second_shift_round: 120

network:
  num_clients: 100
  budget: 10

wireless:
  power_backends: [fixed_power, channel_inversion, ota_feel_power_control, asaad_beamforming_wrapper]
  uplink_snr_db: 18
  sensing_snr_db: 18
  power_budget: 1.0
  bandwidth_budget: 1.0
  latency_budget: 1.0
  energy_budget: 1.0
  aircomp_mse_threshold: 0.05

sensing:
  num_targets: 3
  crb_threshold: 1.0
  sensing_resource_budget: 1.0

reca:
  feature_dim: 6
  output_dim: 6
  tau_reuse: 0.7
  trigger_tau: 0.2
  log_wireless_metrics: true
  log_sensing_metrics: true
  log_adapter_metrics: true

selection:
  methods: [reca, ota_fedavg, aircomp_mse_min, ota_fl_iscc, iscc_air_feel, asaad]

metrics:
  log: [aircomp_mse, crb, crb_cvar, energy, latency, accuracy, recovery_rounds]
