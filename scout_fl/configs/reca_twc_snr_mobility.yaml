experiment: reca_twc_snr_mobility
seed: 0
output_dir: outputs
rounds: 150
first_shift_round: 50
first_shift_end: 100
second_shift_round: 1000

sweeps:
  uplink_snr_db: [0, 5, 10, 15, 20, 30]
  sensing_snr_db: [0, 5, 10, 15, 20, 30]
  fading_severity: [low, medium, high]
  blockage_probability: [0.0, 0.1, 0.25, 0.4]
  target_speed: [low, medium, high]
  client_mobility: [static, pedestrian, vehicular]
  channel_coherence_time: [short, medium, long]
  noise_variance: [0.001, 0.01, 0.1]

network:
  num_clients: 100
  budget: 10

wireless:
  power_budget: 1.0
  bandwidth_budget: 1.0
  latency_budget: 1.0
  energy_budget: 1.0
  aircomp_mse_threshold: 0.05

sensing:
  num_targets: 3
  crb_threshold: 1.0

reca:
  feature_dim: 6
  output_dim: 6
  tau_reuse: 0.7
  trigger_tau: 0.2
  log_wireless_metrics: true
  log_sensing_metrics: true
  log_adapter_metrics: true

selection:
  methods: [reca, fedcs, oort, ota_fedavg, ota_fl_iscc, fed_iscc, iscc_air_feel, asaad]

metrics:
  log: [accuracy, crb_cvar, aircomp_mse, trigger_precision, false_reuse_rate, violations, recovery_rounds]
