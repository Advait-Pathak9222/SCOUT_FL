experiment: reca_twc_reuse
seed: 0
output_dir: outputs
rounds: 150
first_shift_round: 50
first_shift_end: 80
second_shift_round: 120

network:
  num_clients: 100
  budget: 10

wireless:
  regime_sequence: [normal, A, normal, A_prime]
  uplink_snr_db: 18
  sensing_snr_db: 18
  blockage_probability: 0.1
  power_budget: 1.0
  bandwidth_budget: 1.0
  latency_budget: 1.0
  energy_budget: 1.0
  aircomp_mse_threshold: 0.05

sensing:
  num_targets: 3
  crb_threshold: 1.0
  sensing_resource_budget: 1.0

reca:
  feature_dim: 6
  output_dim: 6
  tau_reuse: 0.7
  trigger_tau: 0.2
  adapter_memory_budget: 4
  log_wireless_metrics: true
  log_sensing_metrics: true
  log_adapter_metrics: true

selection:
  methods: [reca, reca_no_memory, reca_score_only, wrong_reuse, random_reuse, oracle_reuse]

metrics:
  log: [second_shift_recovery_time, adapter_reuse_rate, adapter_match_confidence, immediate_accuracy, immediate_crb, rounds_saved, false_reuse_rate, wrong_reuse_penalty]
