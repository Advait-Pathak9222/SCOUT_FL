experiment: reca_twc_ablation
seed: 0
output_dir: outputs
rounds: 150
first_shift_round: 50
first_shift_end: 90
second_shift_round: 120

network:
  num_clients: 100
  budget: 10

wireless:
  uplink_snr_db: 18
  sensing_snr_db: 18
  blockage_probability: 0.15
  power_budget: 1.0
  bandwidth_budget: 1.0
  latency_budget: 1.0
  energy_budget: 1.0
  aircomp_mse_threshold: 0.05

sensing:
  num_targets: 3
  crb_threshold: 1.0
  sensing_resource_budget: 1.0

reca:
  feature_dim: 6
  output_dim: 6
  tau_reuse: 0.7
  trigger_tau: 0.2
  adapter_memory_budget: 4
  log_wireless_metrics: true
  log_sensing_metrics: true
  log_adapter_metrics: true

selection:
  methods: [reca, reca_score_only, reca_no_adapter, reca_no_memory, reca_random_trigger, reca_periodic_trigger, reca_oracle_trigger, reca_no_quarantine, reca_frozen_adapter, wrong_reuse, oracle_reuse]

metrics:
  log: [risk, mismatch, progress, overwhelm, trigger_score, adapter_state, adapter_match_confidence, recovery_rounds, crb_cvar, aircomp_mse_cvar]
