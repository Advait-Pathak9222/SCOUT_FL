# =====================================================================
# TCCN campaign config. This is the configuration the paper reports.
#
# It differs from campaign_main.yaml in five ways, each of which fixes a place
# where the simulation was less physical than the paper claimed.
#
#   1. channel.fading_per_round      the small scale channel is redrawn every
#                                    coherence block instead of being frozen for
#                                    the whole 150 round run, so the dual price
#                                    has a moving channel to track
#   2. sensing.ref_tx_power_dbm      the echo that carries the sensing
#                                    information is the same transmission that
#                                    carries the model update, so the sensing SNR
#                                    now tracks the transmit power, anchored so
#                                    that the nominal point is unchanged
#   3. aircomp.ota_noise_scale auto  the distortion injected into training is
#                                    sqrt(pi * MSE) with pi the measured per entry
#                                    update power, instead of a fixed 0.5 factor
#   4. physical.interference_dbm     an aggregate co channel interference floor,
#                                    null at the nominal point and swept
#   5. selection.methods             the sensing aware pool only, which is
#                                    exactly the set of methods the paper reports
#
# Launch with scripts/schedule_experiments.sh, which runs every stage in order.
# =====================================================================

experiment: campaign_tccn
seed: 0
seeds: [0, 1, 2, 3, 4]
output_dir: outputs

network:
  num_clients: 100
  budget: 10
  num_targets: 3
  num_regions: 9
  area_size: [100.0, 100.0]

geometry:
  layout: clustered
  num_clusters: 5
  cluster_spread: 3.0
  bs_position: [50.0, 50.0]
  random_clients: true
  random_targets: true
  source: synthetic

channel:
  model: rician
  rician_k_db: 6.0
  pathloss_exponent: 3.0
  reference_distance: 10.0
  snr_ref_db: 20.0
  source: synthetic
  fading_per_round: true         # redraw the small scale term every coherence block
  coherence_rounds: 1            # 1 = independent block fading each round

sensing:
  ref_snr_db: 20.0
  ref_distance: 10.0
  pathloss_exponent: 2.0
  rcs_mean: 1.0
  rcs_std: 0.3
  k_range: 1.0
  k_angle: 0.05
  prior_fim: 1.0e-3
  target_weights: [1.0, 1.0, 1.0]
  ref_tx_power_dbm: -15.0        # power at which ref_snr_db was calibrated; makes the
                                 # transmit power sweep act on the sensing axis as well

coverage:
  rho: 0.92
  innovation: 0.08
  sensing_range: 18.0
  saturating: exp

objectives:
  alpha_learning: 1.0
  lambda_sense: 1.0
  lambda_coverage: 0.5
  lambda_fairness: 0.3

constraints:
  crb_max: null
  mse_agg_max: 1.0e-3            # budget on the normalised aggregation error, so an
                                 # aggregation SNR of 30 dB
  latency_max: null
  energy_max: null
  power_budget: null
  infeasible_policy: relax_and_log
  dual_lr: 0.5
  dual_normalized: true          # the dual sees MSE/eps - 1, so the step needs no rescaling

aircomp:
  enabled: true
  ota_distortion: true
  ota_noise_scale: auto          # std = sqrt(pi) * sqrt(MSE), pi measured from the updates
  update_power_init: 1.0e-4      # first round value of pi, before any update is observed
  power: 1.0
  sigma2: 1.0
  bandwidth: 1.0e+6
  model_bits: 1.0e+5

physical:
  enabled: true
  carrier_ghz: 3.5
  noise_figure_db: 7.0
  temperature_k: 290.0
  tx_power_dbm: -15.0
  interference_dbm: null         # null = thermal noise only; swept in stage 5
  bits_per_param: 32
  cycles_per_sample: 1.0e+6

energy:
  cpu_cycles: 1.0e+7
  cpu_freq: 1.0e+9
  kappa: 1.0e-28
  e_sense: 0.1
  t_sense: 0.01

selection:
  # The sensing aware pool. SCOUT-FL and its hard gate ablation, then the eleven
  # baselines the paper compares against. Every number in the paper comes from
  # this set, so nothing outside it needs to be run.
  methods: [scout_v2, scout_greedy,
            collabsensefed, sensing_native, asaad, fixed_weighted,
            fed_iscc, ota_fl_iscc, iscc_air_feel, fedavg_iscc, fedsgd_iscc,
            crb_only, sensing_only,
            comm_only]                     # channel quality reference, not a sensing aware
                                           # baseline; it is the yardstick the collapse
                                           # analysis measures the others against

fl:
  enabled: true
  dataset: cifar10
  data_root: data
  download: true
  model: small_cnn
  optimizer: sgd
  non_iid: spatial
  dirichlet_alpha: 0.3
  rounds: 150
  local_epochs: 1
  batch_size: 64
  lr: 0.05
  device: auto
  probe_batches: 1
  subsample_train: 20000
  subsample_test: 4000

logging:
  save_plots: true
